# ============================================================
# Cloud Build Pipeline
# 1️⃣ Run unit tests
# 2️⃣ Build container image
# 3️⃣ Push to Artifact Registry
# 4️⃣ Deploy to Cloud Run
# ============================================================

substitutions:
  _PROJECT_ID: "josiahs-project-475720"
  _REGION: "us-central1"
  _REPOSITORY: "carprice-repo"
  _SERVICE_NAME: "carprice-api"
  _BUCKET_NAME: "carprice-artifacts"

steps:
  # ------------------------------------------
  # Step 1: Run tests
  # ------------------------------------------
  - name: "python:3.11"
    id: "run-tests"
    entrypoint: bash
    args:
      - "-c"
      - |
        echo "=== Running unit tests ==="
        pip install -r requirements.txt
        pytest -q || (echo "❌ Unit tests failed" && exit 1)
        echo "✅ Tests passed."

  # ------------------------------------------
  # Step 2: Build Docker image
  # ------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}",
        "."
      ]

  # ------------------------------------------
  # Step 3: Push image
  # ------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"
      ]

  # ------------------------------------------
  # Step 4: Deploy to Cloud Run
  # ------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "${_SERVICE_NAME}",
        "--image", "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}",
        "--region", "${_REGION}",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--memory", "2Gi",
        "--cpu", "2",
        "--concurrency", "1",
        "--timeout", "600s",

        # XGBoost safe threading
        "--set-env-vars", "OMP_NUM_THREADS=1,NUMEXPR_NUM_THREADS=1,XGBOOST_NUM_THREADS=1",

        # Gunicorn config
        "--set-env-vars", "GUNICORN_WORKERS=1,GUNICORN_THREADS=1",

        # Public GCS model locations (NO versioning)
        "--set-env-vars", 
        "MODEL_PATH=https://storage.googleapis.com/${_BUCKET_NAME}/models/model.json,PREPROCESSOR_PATH=https://storage.googleapis.com/${_BUCKET_NAME}/models/preprocessor.pkl"
      ]

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
